defaults:
  - dataset: xor
  - model: blackbox
  - engine: engine

## Common parameters
max_epochs: 500
min_epochs: 50
patience: 20
batch_size: 256
gamma: 0.5
lr_step: 100
gpus: [0]
seed: 1
activation: LeakyReLU
num_workers: 0
# this parameter is overridden in the dataset config
latent_size: 64

## Concept-based model parameters
task_penalty: 0.1
int_prob: 0.25

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 1, 2
      dataset: xor, cub, mnist_addition
      model: blackbox, cbm_linear, cbm_mlp, crm, cem, dcr, licem, cmr, m_licem, v_cem, m_licem_pyc 

wandb:
  project: "linear_memory_reasoner"
  entity: "francescothesantis-politecnico-di-torino" 
note: test