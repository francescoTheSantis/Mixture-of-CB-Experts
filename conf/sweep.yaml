defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/everything_sweep/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      # implemented toy datasets: xor, nor, xnor, dot, trigometry, checkmark 
      # implemented image datasets: mnist_addition, cub, cub_incomplete, celeba, awa2, awa2_incomplete, mnist_addition
      # implemented textual datasets: cebab (regression)
      dataset: xor, cub, mnist_addition, awa2, cebab
      # implemented models: blackbox, cbm_linear, cbm_mlp, cem, dcr, licem, cmr, m_licem
      model: blackbox, cbm_linear, cem, dcr, cmr, m_licem

use_stored_dataset: True
extract_embeddings: True

wandb:
  entity: "francescothesantis-politecnico-di-torino"
  project: "linear_memory_reasoner"