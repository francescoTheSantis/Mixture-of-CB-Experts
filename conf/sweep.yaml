defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/everything_sweep/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3
      # implemented datasets:
      # toy: xor, nor, xnor, dot, trigometry, checkmark 
      # vision: mnist_addition, cub, cub_incomplete, celeba, awa2, awa2_incomplete, mnist_addition
      # textual: cebab (regression), sst2 (text generation)
      dataset: xor, cub, mnist_addition, cebab, awa2
      # implemented models: blackbox, cbm_linear, cbm_mlp, cem, dcr, licem, cmr, m_licem
      model: m_licem, blackbox, cbm_linear, cem, dcr, cmr

use_stored_dataset: False
extract_embeddings: False

gpus: [1]

wandb:
  entity: "francescothesantis-politecnico-di-torino"
  project: "linear_memory_reasoner"