defaults:
  - common
  - _self_

loader: 
  name: feynman_I_12_1
  n_samples: 10000
  latent_dim: 2
  noise_std: 0.0
  train_autoencoder: true

# Dataset parameters
metadata:
  task: regression
  lr: 0.001
  name: feynman_I_12_1
  data_type: symbolic_regression
  concept_type: continuous

latent_size: 2

# Feynman I.12.1: mu * Nn (simple multiplication)
# Variables: c0=mu, c1=Nn
equations: "c0 * c1"
