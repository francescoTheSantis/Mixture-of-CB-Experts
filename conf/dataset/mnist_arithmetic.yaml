defaults:
  - common
  - _self_

loader: 
  name: mnist_arithmetic
  n_samples: 10000

# Dataset parameters
metadata:
  task: regression
  lr: 0.0005
  name: mnist_arithmetic
  data_type: image
  concept_type: ['integer', 'integer'] 


# for this dataset, the equations connecting the concepts to the task are known
equations: 
  - "c0 + c1"
  - "c0 - c1"
  - "c0 * c1"
  - "c0 / c1" 
