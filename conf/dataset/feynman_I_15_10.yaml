defaults:
  - common
  - _self_

loader: 
  name: feynman_I_15_10
  n_samples: 10000
  latent_dim: 2
  noise_std: 0.0
  train_autoencoder: true

# Dataset parameters
metadata:
  task: regression
  lr: 0.001
  name: feynman_I_15_10
  data_type: symbolic_regression
  concept_type: continuous

latent_size: 2

# Feynman I.15.10: m0 * v / sqrt(1 - v**2/c**2)
# Relativistic momentum
# Variables: c0=m0, c1=v, c2=c
equations: 
  - "c0 * c1 / sqrt(1 - c1**2/c2**2)"
