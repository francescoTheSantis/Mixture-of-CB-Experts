defaults:
  - common
  - _self_

loader: 
  name: feynman_I_14_3
  n_samples: 10000
  latent_dim: 2
  noise_std: 0.0
  train_autoencoder: true

# Dataset parameters
metadata:
  task: regression
  lr: 0.001
  name: feynman_I_14_3
  data_type: symbolic_regression
  concept_type: continuous

latent_size: 2

# Feynman I.14.3: m * g * z
# Potential energy
# Variables: c0=m, c1=g, c2=z
equations: "c0 * c1 * c2"
