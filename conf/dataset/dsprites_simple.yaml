defaults:
  - common
  - _self_

loader: 
  name: dsprites_simple
  selected_concepts: ['value_orientation', 'value_x_position', 'value_y_position']
  # Concepts available: value_shape, value_scale, value_orientation, value_x_position, value_y_position

  # Formulas for the dataset
  formulas: 
    circle: "exp(10*value_orientation)"
    square: "exp(10*value_orientation)"
    heart: "exp(10*value_orientation)"

# Dataset parameters
metadata:
  task: regression
  lr: 0.001
  name: dsprites
  data_type: image
  concept_type: ['float', 'float', 'float'] 

# for this dataset, the equations connecting the concepts to the task are known
equations: 
  - "exp(10*value_orientation)"
  - "value_x_position * value_y_position"
  - "value_orientation^2 + value_x_position^2 + value_y_position^2"
