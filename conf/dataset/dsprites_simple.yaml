defaults:
  - common
  - _self_

loader: 
  name: dsprites_simple
  selected_concepts: ['value_x_position', 'value_y_position']
  # Concepts available: value_shape, value_scale, value_orientation, value_x_position, value_y_position
  n_samples: 50000
  batch_size: 512

  # Formulas for the dataset
  formulas: 
    circle: "10 * (value_x_position + value_y_position)^2"
    square: "10 * (value_x_position + value_y_position)^2"
    heart: "10 * (value_x_position + value_y_position)^2"

# Dataset parameters
metadata:
  task: regression
  lr: 0.0001
  name: dsprites
  data_type: image
  concept_type: ['float', 'float'] 

# for this dataset, the equations connecting the concepts to the task are known
equations: 
  - "10 * (c0 + c1)^2"
