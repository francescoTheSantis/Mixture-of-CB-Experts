defaults:
  - common
  - /encoder: resnet
  - _self_

loader: 
  name: mnist_addition
  extract_embeddings: false
  batch_size: 128

# Dataset parameters
metadata:
  task: classification
  lr: 0.0001
  name: mnist_addition
  data_type: image

latent_size: 64

encoder:
  _target_: "src.models.encoders.MLPEncoder"
  output_size: ${dataset.latent_size}
  hidden_size: ${dataset.latent_size}
  input_transform:
    _target_: "src.models.encoders.MNISTTransform"
    flatten: true
