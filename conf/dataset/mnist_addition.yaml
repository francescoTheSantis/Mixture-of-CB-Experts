defaults:
  - common
  - /encoder: mlp
  - _self_

loader: 
  name: mnist_addition
  extract_embeddings: false
  batch_size: 128

# Dataset parameters
metadata:
  task: classification
  lr: 0.0001
  name: mnist_addition
  data_type: image
  concept_type: binary

latent_size: 64

encoder:
  encoder:
    input_transform:
      _target_: "src.models.encoders.transform.MNISTTransform"
      flatten: false