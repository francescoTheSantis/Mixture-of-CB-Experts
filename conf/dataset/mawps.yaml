defaults:
  - common
  - _self_

loader: 
  name: mawps
  dataset_already_created: True
  batch_size: 1024

# Dataset parameters
metadata:
  task: regression
  lr: 0.001
  name: mawps
  data_type: text
  concept_type: continuous

equations:
  # - "( c0 + c1 ) / c2"
  # - "( c1 + c2 ) / c0"
  - "c2 * ( c0 + c1 )"
  - "c0 * ( c1 - c2 )"
  # - "c0 + c2 - c1"
  - "c2 * ( c0 - c1 )"
  # - "c0 + c1 + c2"
  # - "c0 + c1 - c2"
  # - "( c0 - c1 ) / c2"
  - "c0 * ( c1 + c2 )"