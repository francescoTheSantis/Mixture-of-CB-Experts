defaults:
  - common
  - _self_

loader: 
  name: feynman_I_6_2
  n_samples: 10000
  latent_dim: 2
  noise_std: 0.0
  train_autoencoder: true

# Dataset parameters
metadata:
  task: regression
  lr: 0.001
  name: feynman_I_6_2
  data_type: symbolic_regression
  concept_type: continuous

latent_size: 2

# Feynman I.6.2: exp(-(theta/sigma)**2/2) / (sqrt(2*pi) * sigma)
# Variables: c0=theta, c1=sigma
equations: 
  - "exp(-(c0/c1)**2/2) / (sqrt(2*pi) * c1)"
