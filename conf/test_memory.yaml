defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: dsprites_simple, mnist_arithmetic
      model: l_cmr, sym_cmr_kan 
      memory_size: 1, 4, 10, 50, 100, 200
    
gpus: [1]

max_epochs: 200
patience: 100

scale_target: False
disjoint_training: True

use_stored_dataset: True
extract_embeddings: True

selector_model: mlp

int_prob: 0
task_penalty: 1.0

note: test_prior