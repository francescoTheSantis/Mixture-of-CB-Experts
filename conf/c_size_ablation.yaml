defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/concept_size_ablation/${now:%Y-%m-%d_%H-%M-%S} 
  sweeper:
    grid_params:
      seed: 1, 2, 3
      concept_percentage: 0.2, 0.4, 0.6, 0.8

    list_params:
      model: 
        - dcr
        - licem
        - cem
        - blackbox
        - memory_cbm
        - lin_sym_cbm
        - cmr
        - sr_sym_cbm
      disjoint_training:
        - False
        - False
        - False
        - False
        - True
        - True
        - True
        - True
      dataset: 
        - awa2
        - cub
        - cifar10
        - cifar100
      img_backbone_name: 
        - facebook/dinov2-base
        - facebook/dinov2-base
        - google/vit-base-patch32-224-in21k
        - google/vit-large-patch16-224-in21k

memory_size: 1

note: "concept_size_ablation" 