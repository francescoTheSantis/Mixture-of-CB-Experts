## Use this configuration to preprocess and store datasets only.

defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      # This directory can be deleted as it only contains temporary files and the 
      # preprocessed data will be saved in the cache.
      dir: preprocess/${now:%Y-%m-%d_%H-%M-%S} 
  sweeper:
    grid_params:
      seed: 1, 2, 3, 4, 5

    list_params:
      dataset: 
        - cub
        - cub_incomplete
        - awa2
        - awa2_incomplete
        - cifar10
        - cifar100
        - dsprites_simple
        - pendulum
        - feynman_I_12_1
        - feynman_I_14_3
        - feynman_I_15_10
        - mnist_arithmetic
        - dsprites_complex
        - mawps
      img_backbone_name: 
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - google/vit-base-patch32-224-in21k
        - google/vit-base-patch32-224-in21k
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base

use_stored_dataset: False # Set this parameter to False to preprocess the dataset from scratch.
extract_embeddings: True # Set this variable to true to preprocess the data using a pre-trained model.

only_store_dataset: True # Only preprocess and store the dataset without training the model.

# No need to set wandb parameters for preprocessing only.
wandb:
  entity: null
  project: null