defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/cub_ablation/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3
      dataset: cub
      concept_percentage: 1.0, 0.8, 0.6, 0.4, 0.2
      model: dcr, cmr, licem, m_licem

gpus: [1]


wandb:
  # Set the params below if you want to use wandb as logger.
  # Set it to null if you do not want to use wandb.
  project: null 
  entity: null