defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: awa2 # mnist_addition, awa2_incomplete, awa2, cub, cub_incomplete 
      model: sr_sym_cbm 
      memory_size: 1
    
gpus: [2]

scale_variables: False

# NOTE: check this variable before running experiments 
disjoint_training: False

max_epochs: 1
patience: 50

use_stored_dataset: True
extract_embeddings: True

wandb:
  entity: null
  project: null

note: test