defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: xor # synthetic_motion 
      model: sr_sym_cbm # sr_sym_cbm, prior_sym_cbm, kan_sym_cbm
      memory_size: 1
    
gpus: [0]

scale_variables: False

img_backbone_name: resnet18

# NOTE: check this variable before running experiments 
disjoint_training: False

max_epochs: 100
patience: 50

use_stored_dataset: True
extract_embeddings: True

wandb:
  entity: null
  project: null

note: test