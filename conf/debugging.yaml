defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/concept_size_ablation/${now:%Y-%m-%d_%H-%M-%S} 
  sweeper:
    grid_params:
      seed: 1 
      model: sr_sym_cbm
      memory_size: 1, 2
        
    list_params:
      dataset: 
        - cub
      img_backbone_name: 
        - facebook/dinov2-base

disjoint_training: true
hard_concepts: True

gpus: [1]
