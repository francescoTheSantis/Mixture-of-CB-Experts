defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: cifar10 #, awa2_incomplete, awa2, cub, cub_incomplete 
      model: cbm_linear 
      memory_size: 1
    
gpus: [0]

img_backbone_name: resnet18

# NOTE: check this variable before running experiments 
disjoint_training: False
hard_concepts: False

L1_coeff: 1e-5
threshold: 1e-6

max_epochs: 200
patience: 50

use_stored_dataset: True
extract_embeddings: True

wandb:
  entity: null
  project: null

note: test