defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: mnist_addition # mnist_addition, awa2_incomplete, awa2, cub, cub_incomplete 
      model: blackbox 
      memory_size: 1
    
gpus: [1]

# NOTE: check this variable before running experiments 
disjoint_training: False
hard_concepts: True

max_epochs: 5
patience: 50

use_stored_dataset: True
extract_embeddings: True

wandb:
  entity: null
  project: null

note: test