defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: mnist_addition, awa2_incomplete, awa2, cub, cub_incomplete # synthetic_motion 
      model: sr_sym_cbm # sr_sym_cbm, prior_sym_cbm, kan_sym_cbm
      memory_size: 1, 2, 3
    
gpus: [0]

scale_variables: False

# NOTE: check this variable before running experiments 
disjoint_training: True
hard_concepts: True

max_epochs: 500
patience: 50

use_stored_dataset: True
extract_embeddings: True

wandb:
  entity: null
  project: null

note: test