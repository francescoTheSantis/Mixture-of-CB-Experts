defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: pendulum #, dsprites_simple, dsprites_complex, pendulum, cub, cub_incomplete, awa2, awa2_incomplete, cifar10, cifar100
      model: blackbox
      memory_size: 1
    
gpus: [0]

max_epochs: 5
patience: 20

use_stored_dataset: True
extract_embeddings: True

disjoint_training: True

