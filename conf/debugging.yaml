defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      # dsprites_simple, dsprites_complex, pendulum, cub, cub_incomplete, awa2, awa2_incomplete, cifar10, cifar100
      dataset: dsprites_complex
      model: kan_sym_cbm # kan_sym_cbm, lin_sym_cbm, prior_sym_cbm, cbm_linear
      memory_size: 4
    
gpus: [1]

max_epochs: 100
patience: 20

use_stored_dataset: True
extract_embeddings: True

wandb:
  entity: null
  project: null

note: test