defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: awa2_incomplete # mnist_addition, awa2_incomplete, awa2, cub, cub_incomplete 
      model: lin_sym_cbm 
      memory_size: 1
    
gpus: [1]

# NOTE: check this variable before running experiments 
disjoint_training: True

L1_coeff: 1e-5
threshold: 1e-6

max_epochs: 600
patience: 50

use_stored_dataset: True
extract_embeddings: True

wandb:
  entity: null
  project: null

note: test