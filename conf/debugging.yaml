defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/concept_size_ablation/${now:%Y-%m-%d_%H-%M-%S} 
  sweeper:
    grid_params:
      seed: 1 
      model: sym_m_cbe, lin_m_cbe, prior_m_cbe, mlp_m_cbe
      memory_size: 2
        
    list_params:
      dataset: 
        - dsprites_simple
      # img_backbone_name: 
      #   - facebook/dinov2-base

disjoint_training: true
hard_concepts: True

max_epochs: 1
gpus: [0]
