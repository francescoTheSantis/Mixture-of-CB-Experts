defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3
      dataset: dsprites_simple, mnist_arithmetic
      model: sym_cmr_prior, blackbox

gpus: [3]

max_epochs: 500
patience: 50

scale_target: False
disjoint_training: True

use_stored_dataset: True
extract_embeddings: True

selector_model: mlp

int_prob: 0
task_penalty: 1.0

note: test_prior