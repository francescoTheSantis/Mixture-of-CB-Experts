defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/cub_incomplete/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1 #, 2, 3, 4, 5
      dataset: cub_incomplete
      model: blackbox, cbm_linear, cem, dcr, licem

# Bigger backbone for real world datasets
img_backbone_name: facebook/dinov2-base