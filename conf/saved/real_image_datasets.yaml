defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/real_image_datasets/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      dataset: cub, cub_incomplete, awa2, awa2_incomplete
      model: blackbox, cbm_linear, cem, dcr, licem, cmr, m_licem

# Bigger backbone for real world datasets
img_backbone_name: facebook/dinov2-base