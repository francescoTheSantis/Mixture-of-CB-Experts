defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: mnist_arithmetic, dsprites_simple
      model: l_cmr, sym_cmr_kan
      memory_size: 1, 4, 10, 50, 100
    
gpus: [3]

max_epochs: 500
patience: 50

scale_target: False
disjoint_training: True

use_stored_dataset: True
extract_embeddings: True

selector_model: mlp

int_prob: 0
task_penalty: 1.0

note: test_prior