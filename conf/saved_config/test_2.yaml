defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      #dataset: mnist_arithmetic, dsprites_simple, dsprites_complex, pendulum, cub, cub_incomplete, awa2, awa2_incomplete, cifar10, cifar100
      dataset: cub, cub_incomplete, awa2, awa2_incomplete
      model: blackbox
      memory_size: 1
    
gpus: [1]

max_epochs: 1
patience: 50

use_stored_dataset: True
extract_embeddings: True

disjoint_training: true
int_prob: 0.25

wandb:
  entity: null
  project: null

note: test