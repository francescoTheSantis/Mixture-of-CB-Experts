defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/sym_cmr_kan_reg/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3 #, 4, 5
      memory_size: 1, 2, 3, 4, 5, 10, 20, 50
      dataset: mnist_arithmetic, dsprites_simple, dsprites_complex, pendulum, cub, cub_incomplete, awa2, awa2_incomplete, cifar10, cifar100
      model: sym_cmr_kan_reg

## Shared Concept-based model parameters
task_penalty: 1.0
concept_penalty: 1.0
int_prob: 0.0
hard_concepts: False
# It controls whether the concept and task predictors are trained jointly or in parallel.
disjoint_training: True
