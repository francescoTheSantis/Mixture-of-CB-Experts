defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/cbm_linear/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3 #, 4, 5
      dataset: mnist_arithmetic, dsprites_simple, dsprites_complex, pendulum, cub, cub_incomplete, awa2, awa2_incomplete, cifar10, cifar100
      memory_size: 1
      model: cbm_linear

disjoint_training: False
int_prob: 0.25

## Shared Concept-based model parameters
task_penalty: 0.1
concept_penalty: 1.0