defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/L1_ablation/${now:%Y-%m-%d_%H-%M-%S} 
  sweeper:
    grid_params:
      seed: 1, 2, 3
      model: lin_m_cbe, mlp_m_cbe
      L1_coeff: 0.0, 0.0001, 0.001, 0.01, 0.1, 1.0, 10

    list_params:
      dataset: 
        - cub
        - awa2
        - cub_incomplete
        - awa2_incomplete
      img_backbone_name: 
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base

disjoint_training: True

note: "L1_ablation" 