defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/cmr_toy/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      memory_size: 1, 2, 3, 4, 5, 10, 20
      dataset: cifar10
      model: cmr

hard_concepts: True # as in the original CMR paper

img_backbone_name: google/vit-base-patch32-224-in21k
