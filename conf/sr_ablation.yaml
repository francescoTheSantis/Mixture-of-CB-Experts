defaults:
  - common
  - _self_
  - override hydra/sweeper: list
  
hydra:
  mode: MULTIRUN
  sweep:
      dir: output/sr_ablation/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    grid_params:
      seed: 1, 2, 3, 4, 5
      model: sr_sym_cbm, lin_sym_cbm, kan_sym_cbm, prior_sym_cbm, blackbox, cem, licem
    
    # additional list sweeper - pairs each dataset with its specific memory size. 
    # Which corresponds to the actual number of mechanisms in the dataset
    list_params:
      dataset: feynman_I_12_1, feynman_I_14_3, feynman_I_15_10, dsprites_simple, pendulum, dsprites_complex, mnist_arithmetic, mawps
      memory_size: 1, 1, 1, 1, 1, 3, 4, 4
      
gpus: [1]

wandb:
  entity: null
  project: null

note: test