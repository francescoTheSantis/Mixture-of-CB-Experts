defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/memory_cls/${now:%Y-%m-%d_%H-%M-%S} 
  sweeper:
    grid_params:
      model: lin_sym_cbm, cmr #, memory_cbm, sr_sym_cbm
      memory_size: 1, 2, 3, 4, 5 
      seed: 1, 2, 3, 4, 5

    list_params:
      dataset: 
        - cub
        - cub_incomplete
        - awa2
        - awa2_incomplete
        - cifar10
        # - cifar100
      img_backbone_name: 
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - resnet18
        # - resnet18

disjoint_training: True
hard_concepts: True

gpus: [0]

note: "Memory-cls" 