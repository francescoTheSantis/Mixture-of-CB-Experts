defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/licem/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3 #, 4, 5
      dataset: cub, cub_incomplete, awa2, awa2_incomplete, cifar10, cifar100
      memory_size: 0
      model: licem

# Bigger backbone for real world datasets
img_backbone_name: facebook/dinov2-base

disjoint_training: False
int_prob: 0.25

## Shared Concept-based model parameters
task_penalty: 0.1
concept_penalty: 1.0

gpus: [1]