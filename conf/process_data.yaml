defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/process_data/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2 #, 3, 4, 5
      dataset: mnist_arithmetic, dsprites_simple, cub, cub_incomplete, awa2, awa2_incomplete, mnist_addition, cifar10, cifar100
      model: blackbox
      max_epochs: 1

# Small backbone for toy datasets
img_backbone_name: facebook/dinov2-base

# Disable wandb logging by default for toy data processing
wandb:
  project: null
  entity: null