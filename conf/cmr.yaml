defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/cmr/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      memory_size: 1, 2, 3, 4, 5, 10, 20
      dataset: cub, cub_incomplete, awa2, awa2_incomplete
      model: cmr

hard_concepts: True # as in the original CMR paper
