defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/l_cmr/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      dataset: mnist_arithmetic, dsprites_simple, cub, cub_incomplete, awa2, awa2_incomplete, mnist_addition
      memory_size: 1, 2, 3, 4, 5, 10, 20, 50
      model: l_cmr

# Bigger backbone for real world datasets
img_backbone_name: facebook/dinov2-base

gpus: [1]