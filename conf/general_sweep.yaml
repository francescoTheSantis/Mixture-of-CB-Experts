defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/general_sweep/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      dataset: xor, cub, cub_incomplete, awa2, awa2_incomplete, cebab, cifar10, cifar100
      model: blackbox, cbm_linear, cem, dcr, licem, cmr, m_licem