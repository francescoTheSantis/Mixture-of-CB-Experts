defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/prior_reg/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    grid_params:
      model: prior_sym_cbm
      seed: 1, 2, 3, 4, 5

    # The additional list sweeper is used to pair each dataset with its specific number of mechanisms. 
    list_params:
      dataset: dsprites_simple, pendulum, dsprites_complex, mnist_arithmetic, mawps
      memory_size: 1, 1, 3, 4, 4

disjoint_training: True

gpus: [0]

wandb:
  entity: null
  project: null
