defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: cub #dsprites_simple, dsprites_complex, pendulum, mnist_arithmetic
      model: licem
      memory_size: 1
    
gpus: [0]

max_epochs: 20
patience: 50

use_stored_dataset: True
extract_embeddings: True

disjoint_training: true
int_prob: 0.25


note: test_prior