defaults:
  - dataset: xor
  - model: blackbox
  - engine: engine

## Common parameters
max_epochs: 500
min_epochs: 50
patience: 20
batch_size: 128
gamma: 0.5
lr_step: 100
gpus: [1]
seed: 1
activation: LeakyReLU
num_workers: 0
latent_size: 64

## Concept-based model parameters
task_penalty: 0.1
int_prob: 0.1

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 1
      dataset: mnist_addition
      model: dcr

wandb:
  project: "linear_memory_reasoner"
  entity: "francescothesantis-politecnico-di-torino" 
note: test