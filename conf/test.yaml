defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: mnist_arithmetic, mnist_addition
      model: sym_cmr_kan, l_cmr
      memory_size: 1, 5
    
gpus: [3]

max_epochs: 1
patience: 50

scale_target: False
disjoint_training: True

use_stored_dataset: True
extract_embeddings: True

selector_model: mlp

int_prob: 0
task_penalty: 1

note: test_prior