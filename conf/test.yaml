defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: dsprites_simple 
      model: sym_cmr_prior 
      memory_size: 4 
gpus: [0]

max_epochs: 200
patience: 100

scale_target: False
disjoint_training: True

use_stored_dataset: True
extract_embeddings: True

selector_model: mlp

int_prob: 0
task_penalty: 1.0

note: test_prior