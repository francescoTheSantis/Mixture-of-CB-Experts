defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1
      dataset: cub_incomplete, awa2, awa2_incomplete, cifar10, cifar100, mnist_addition, dsprites_simple
      model: sym_cmr_kan
      memory_size: 2
    
gpus: [0]

max_epochs: 5
patience: 50

scale_target: False
disjoint_training: True

use_stored_dataset: True
extract_embeddings: True

selector_model: mlp

int_prob: 0
task_penalty: 1

note: test_prior