defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      # This directory can be deleted as it only contains temporary files and the 
      # preprocessed data will be saved in the cache.
      dir: memory_models/${now:%Y-%m-%d_%H-%M-%S} 
  sweeper:
    grid_params:
      seed: 1, 2, 3, 4, 5
      model: cmr, lin_sym_cbm
      memory_size: 1, 2, 3, 4, 5, 10

    list_params:
      dataset: 
        - cub
        - cub_incomplete
        - awa2
        - awa2_incomplete
        - cifar10
      img_backbone_name: 
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - facebook/dinov2-base
        - google/vit-base-patch32-224-in21k

note: "Memory" 