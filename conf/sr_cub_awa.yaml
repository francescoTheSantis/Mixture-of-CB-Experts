defaults:
  - common
  - _self_
  - override hydra/sweeper: list

hydra:
  mode: MULTIRUN
  sweep:
      dir: test/memory_cls/${now:%Y-%m-%d_%H-%M-%S} 
  sweeper:
    grid_params:
      model: sr_sym_cbm
      memory_size: 1, 2
      seed: 1, 2 # 1, 2, 3, 4, 5

    list_params:
      dataset: 
        # - mnist_addition
        # - cub
        - cub_incomplete
        # - awa2
        - awa2_incomplete
        - cifar10
        # - cifar100
      img_backbone_name: 
        # - facebook/dinov2-base
        # - facebook/dinov2-base
        - facebook/dinov2-base
        # - facebook/dinov2-base
        - facebook/dinov2-base
        - google/vit-base-patch32-224-in21k
        # - google/vit-base-patch32-224-in21k

disjoint_training: False
hard_concepts: False

gpus: [1]

note: "Memory-cls" 

wandb:
  project: null
  entity: null