defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/mnist_addition/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1 #, 2, 3, 4, 5
      dataset: mnist_addition
      model: blackbox, cbm_linear, cem, dcr, licem

# Bigger backbone for real world datasets
img_backbone_name: facebook/dinov2-base

gpus: [1]