defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/synthetic_motion/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      memory_size: 1, 2, 3, 4, 5
      dataset: synthetic_motion
      model: l_cmr

# Video embedding from TimeSformer (no backbone needed)
video_backbone_name: facebook/timesformer-base-finetuned-k400
