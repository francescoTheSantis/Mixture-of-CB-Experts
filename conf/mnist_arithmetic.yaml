defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/mnist_arithmetic/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      dataset: mnist_arithmetic
      model: blackbox, cbm_linear

# Small backbone for toy datasets
img_backbone_name: resnet50