defaults:
  - common
  - _self_

hydra:
  mode: MULTIRUN
  sweep:
      dir: output/l_cmr_toy/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    params:
      seed: 1, 2, 3, 4, 5
      memory_size: 1, 2, 3, 4, 5, 10, 20
      dataset: cifar10
      model: l_cmr

## Shared Concept-based model parameters
task_penalty: 1.0
concept_penalty: 1.0
int_prob: 0.0
hard_concepts: False
# It controls whether the concept and task predictors are trained jointly or in parallel.
disjoint_training: False

img_backbone_name: google/vit-base-patch32-224-in21k